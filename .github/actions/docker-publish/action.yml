name: Build and Publish Docker Image

description: Build the multi-arch image from the freshly built release archives and push it to ghcr.io

inputs:
  push:
    description: Push the image after building
    default: "true"
  version:
    description: Version suffix of the release archives in bin/
    required: true
  username:
    description: ghcr login username
    required: true
  password:
    description: ghcr login password
    required: true
  tags:
    description: Image tags to build/push
    required: true

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ${{ github.workspace }}
        file: ./docker/Dockerfile
        push: ${{ inputs.push }}
        build-args: |
          MIAOSPEED_VERSION=${{ inputs.version }}
        tags: ${{ inputs.tags }}
        platforms: linux/386,linux/amd64,linux/arm/v7,linux/arm64/v8
