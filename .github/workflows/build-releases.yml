name: build and releases
on:
  push:
    branches:
      - "build"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  go-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get the tag
        run: |
          echo "MIAOSPEED_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "The tag is ${{ github.ref_name }}"

      - uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache: true

      - name: fix embeded
        run: |
          go env
          mkdir ./preconfigs/embeded/miaokoCA
          echo "${{ secrets.MIAOSPEED_CRT }}" > ./preconfigs/embeded/miaokoCA/miaoko.crt
          echo "${{ secrets.MIAOSPEED_KEY }}" > ./preconfigs/embeded/miaokoCA/miaoko.key
          echo "${{ secrets.MS_BUILDTOKEN }}" > ./utils/embeded/BUILDTOKEN.key
          head -n 5 ./engine/embeded/default_geoip.js

      - name: build
        run: |
          make releases VERSION="${MIAOSPEED_TAG:-${{ github.ref_name }}}"

      - name: Release to current repository
        uses: softprops/action-gh-release@v2
        with:
          files: ./bin/*
          body_path: './CHANGELOG.md'
          tag_name: ${{ env.MIAOSPEED_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.MIAOSPEED_TAG }}
            ghcr.io/${{ github.repository }}:latest
          platforms: linux/386,linux/amd64,linux/arm/v7,linux/arm64/v8

      - name: Logout from GitHub Container Registry
        run: docker logout ghcr.io